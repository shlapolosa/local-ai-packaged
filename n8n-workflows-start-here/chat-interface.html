<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Migration Setup Assistant</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .chat-container {
      width: 100%;
      max-width: 600px;
      height: 80vh;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .chat-header h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .chat-header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .progress-bar {
      background: rgba(255, 255, 255, 0.2);
      height: 4px;
      margin-top: 12px;
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      background: white;
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .message.assistant .message-avatar {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .message.user .message-avatar {
      background: #e2e8f0;
    }

    .message-content {
      background: #f7fafc;
      padding: 12px 16px;
      border-radius: 12px;
      max-width: 70%;
      word-wrap: break-word;
    }

    .message.user .message-content {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .message.assistant .message-content {
      background: #edf2f7;
      color: #2d3748;
    }

    .typing-indicator {
      display: none;
      gap: 4px;
      padding: 12px 16px;
      background: #edf2f7;
      border-radius: 12px;
      width: fit-content;
    }

    .typing-indicator.active {
      display: flex;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #cbd5e0;
      animation: typing 1.4s infinite;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        transform: translateY(0);
      }
      30% {
        transform: translateY(-10px);
      }
    }

    .chat-input-container {
      padding: 20px;
      border-top: 1px solid #e2e8f0;
      background: white;
    }

    .chat-input-wrapper {
      display: flex;
      gap: 12px;
    }

    .chat-input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .chat-input:focus {
      border-color: #667eea;
    }

    .send-button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .send-button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .send-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .progress-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .progress-chip {
      padding: 4px 12px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .progress-chip.complete {
      background: rgba(72, 187, 120, 0.3);
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <h1>🤖 Migration Setup Assistant</h1>
      <p>Let me help you configure your React Native to native migration</p>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-chips" id="progressChips"></div>
    </div>

    <div class="chat-messages" id="messages">
      <!-- Messages will be added here -->
    </div>

    <div class="chat-input-container">
      <div class="chat-input-wrapper">
        <input
          type="text"
          class="chat-input"
          id="messageInput"
          placeholder="Type your message..."
          onkeypress="if(event.key==='Enter') sendMessage()"
        >
        <button class="send-button" id="sendButton" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <script>
    const N8N_URL = 'http://localhost:8001';
    let sessionId = null;
    let sessionState = null;
    let conversationHistory = [];
    let detectedIntent = null;

    // Initialize chat with welcome message
    window.onload = () => {
      addMessage('assistant', 'Hi! 👋 I\'m your AI assistant. I can help you with:\n\n🔄 **White-Label Migration** - Migrate React Native apps to native platforms\n🏗️ **End-to-End Solutions** - Build new solutions from scratch (coming soon)\n\nWhat would you like to do today?');
    };

    function addMessage(role, content) {
      const messagesDiv = document.getElementById('messages');

      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${role}`;

      const avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      avatar.textContent = role === 'assistant' ? '🤖' : '👤';

      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';
      contentDiv.textContent = content;

      messageDiv.appendChild(avatar);
      messageDiv.appendChild(contentDiv);
      messagesDiv.appendChild(messageDiv);

      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      // Add to conversation history
      conversationHistory.push({ role, content });
    }

    function showTyping() {
      const messagesDiv = document.getElementById('messages');
      const typingDiv = document.createElement('div');
      typingDiv.className = 'message assistant';
      typingDiv.innerHTML = `
        <div class="message-avatar">🤖</div>
        <div class="typing-indicator active">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      `;
      typingDiv.id = 'typingIndicator';
      messagesDiv.appendChild(typingDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function hideTyping() {
      const typingDiv = document.getElementById('typingIndicator');
      if (typingDiv) typingDiv.remove();
    }

    function updateIntentBadge(intent) {
      const headerTitle = document.querySelector('.chat-header h1');

      let intentEmoji = '🤖';
      let intentText = 'AI Assistant';

      if (intent === 'whitelabel_migration') {
        intentEmoji = '🔄';
        intentText = 'White-Label Migration';
      } else if (intent === 'e2e_solution') {
        intentEmoji = '🏗️';
        intentText = 'End-to-End Solution';
      }

      headerTitle.textContent = `${intentEmoji} ${intentText}`;
    }

    function updateProgress(progress) {
      const completed = Object.values(progress || {}).filter(Boolean).length;
      const total = 4; // repoRN, monorepoUrl, platforms, reviewers
      const percentage = (completed / total) * 100;

      document.getElementById('progressFill').style.width = `${percentage}%`;

      // Update chips
      const chipsDiv = document.getElementById('progressChips');

      // Only show progress chips if intent is whitelabel migration
      if (detectedIntent === 'whitelabel_migration') {
        chipsDiv.innerHTML = `
          <div class="progress-chip ${progress?.repoRN ? 'complete' : ''}">
            ${progress?.repoRN ? '✅' : '⏳'} RN Repo
          </div>
          <div class="progress-chip ${progress?.monorepoUrl ? 'complete' : ''}">
            ${progress?.monorepoUrl ? '✅' : '⏳'} Monorepo
          </div>
          <div class="progress-chip ${progress?.platforms ? 'complete' : ''}">
            ${progress?.platforms ? '✅' : '⏳'} Platforms
          </div>
          <div class="progress-chip ${progress?.reviewers ? 'complete' : ''}">
            ${progress?.reviewers ? '✅' : '⏳'} Reviewers
          </div>
        `;
      } else {
        chipsDiv.innerHTML = '';
      }
    }

    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const sendButton = document.getElementById('sendButton');
      const message = input.value.trim();

      if (!message) return;

      // Add user message
      addMessage('user', message);
      input.value = '';

      // Disable input
      input.disabled = true;
      sendButton.disabled = true;
      showTyping();

      try {
        // Call n8n Configuration Assistant (Intent Router)
        const response = await fetch(`${N8N_URL}/webhook/chat/assistant`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message,
            history: conversationHistory.slice(0, -1), // Exclude current user message
            sessionId,
            state: sessionState
          })
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const result = await response.json();

        hideTyping();

        // Update session
        sessionId = result.sessionId;
        sessionState = result.sessionState;
        detectedIntent = result.intent;

        // Add assistant message
        addMessage('assistant', result.message);

        // Update header with detected intent
        if (detectedIntent) {
          updateIntentBadge(detectedIntent);
        }

        // Update progress
        updateProgress(result.progress);

        // Check if complete
        if (result.complete) {
          input.disabled = true;
          sendButton.disabled = true;
          document.getElementById('progressFill').style.width = '100%';
        }

      } catch (error) {
        hideTyping();
        addMessage('assistant', `❌ Error: ${error.message}\n\nPlease ensure n8n is running at ${N8N_URL} and the Configuration Assistant workflow is active.`);
      } finally {
        input.disabled = false;
        sendButton.disabled = false;
        input.focus();
      }
    }
  </script>
</body>
</html>
