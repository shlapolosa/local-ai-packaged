include:
  - ./supabase/docker/docker-compose.yml

volumes:
  n8n_storage:
  ollama_storage:
  qdrant_storage:
  open-webui:
  flowise:
  caddy-data:
  caddy-config:
  valkey-data:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  opencode_data:

x-n8n: &service-n8n
  image: n8nio/n8n:latest
  environment:
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=db
    - DB_POSTGRESDB_USER=postgres
    - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    - DB_POSTGRESDB_DATABASE=postgres
    - N8N_DIAGNOSTICS_ENABLED=false
    - N8N_PERSONALIZATION_ENABLED=false
    - N8N_ENCRYPTION_KEY
    - N8N_USER_MANAGEMENT_JWT_SECRET
    - WEBHOOK_URL=${N8N_HOSTNAME:+https://}${N8N_HOSTNAME:-http://localhost:5678}
    - N8N_RESTRICT_FILE_ACCESS_TO=/home/node/.n8n-files;/data/shared

x-ollama: &service-ollama
  image: ollama/ollama:latest
  container_name: ollama
  restart: unless-stopped
  expose:
    - 11434/tcp
  environment:
    - OLLAMA_CONTEXT_LENGTH=8192
    - OLLAMA_FLASH_ATTENTION=1
    - OLLAMA_KV_CACHE_TYPE=q8_0
    - OLLAMA_MAX_LOADED_MODELS=2
    - HTTP_PROXY=http://proxy.internal.adhie.ae:8080
    - HTTPS_PROXY=http://proxy.internal.adhie.ae:8080
    - NO_PROXY=localhost,127.0.0.1,.internal.adhie.ae
    - http_proxy=http://proxy.internal.adhie.ae:8080
    - https_proxy=http://proxy.internal.adhie.ae:8080
    - no_proxy=localhost,127.0.0.1,.internal.adhie.ae
  volumes:
    - ollama_storage:/root/.ollama

x-init-ollama: &init-ollama
  image: ollama/ollama:latest
  container_name: ollama-pull-llama
  volumes:
    - ollama_storage:/root/.ollama
  entrypoint: /bin/sh
  command:
    - "-c"
    - >
      sleep 3;
      OLLAMA_HOST=ollama:11434 ollama pull qwen2.5:7b-instruct-q4_K_M;
      OLLAMA_HOST=ollama:11434 ollama pull llama3.1:8b-instruct-q4_K_M;
      OLLAMA_HOST=ollama:11434 ollama pull nomic-embed-text
  environment:
    - HTTP_PROXY=http://proxy.internal.adhie.ae:8080
    - HTTPS_PROXY=http://proxy.internal.adhie.ae:8080
    - NO_PROXY=localhost,127.0.0.1,.internal.adhie.ae
    - http_proxy=http://proxy.internal.adhie.ae:8080
    - https_proxy=http://proxy.internal.adhie.ae:8080
    - no_proxy=localhost,127.0.0.1,.internal.adhie.ae

services:
  taskmaster-gpu:
    profiles: ["gpu-nvidia"]
    build:
      context: .
      dockerfile: Dockerfile.taskmaster
      args:
        HTTP_PROXY: http://proxy.internal.adhie.ae:8080
        HTTPS_PROXY: http://proxy.internal.adhie.ae:8080
        NO_PROXY: localhost,127.0.0.1,.internal.adhie.ae
    container_name: taskmaster
    restart: unless-stopped
    volumes:
      - ./projects:/app/projects
      - ./shared:/data/shared
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_BASE_URL=http://ollama:11434/api
      - TASKMASTER_MODEL=llama3.1:8b-instruct-q4_K_M
      - MODEL=llama3.1:8b-instruct-q4_K_M
      - OPENAI_API_KEY=sk-placeholder
      - TASK_MASTER_TOOLS=standard
      - HTTP_PROXY=http://proxy.internal.adhie.ae:8080
      - HTTPS_PROXY=http://proxy.internal.adhie.ae:8080
      - NO_PROXY=localhost,127.0.0.1,.internal.adhie.ae
      - http_proxy=http://proxy.internal.adhie.ae:8080
      - https_proxy=http://proxy.internal.adhie.ae:8080
      - no_proxy=localhost,127.0.0.1,.internal.adhie.ae
    depends_on:
      - ollama-gpu
      - n8n
    stdin_open: true
    tty: true

  taskmaster-gpu-amd:
    profiles: ["gpu-amd"]
    build:
      context: .
      dockerfile: Dockerfile.taskmaster
      args:
        HTTP_PROXY: http://proxy.internal.adhie.ae:8080
        HTTPS_PROXY: http://proxy.internal.adhie.ae:8080
        NO_PROXY: localhost,127.0.0.1,.internal.adhie.ae
    container_name: taskmaster
    restart: unless-stopped
    volumes:
      - ./projects:/app/projects
      - ./shared:/data/shared
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_BASE_URL=http://ollama:11434/api
      - TASKMASTER_MODEL=llama3.1:8b-instruct-q4_K_M
      - MODEL=llama3.1:8b-instruct-q4_K_M
      - OPENAI_API_KEY=sk-placeholder
      - TASK_MASTER_TOOLS=standard
      - HTTP_PROXY=http://proxy.internal.adhie.ae:8080
      - HTTPS_PROXY=http://proxy.internal.adhie.ae:8080
      - NO_PROXY=localhost,127.0.0.1,.internal.adhie.ae
      - http_proxy=http://proxy.internal.adhie.ae:8080
      - https_proxy=http://proxy.internal.adhie.ae:8080
      - no_proxy=localhost,127.0.0.1,.internal.adhie.ae
    depends_on:
      - ollama-gpu-amd
      - n8n
    stdin_open: true
    tty: true

  opencode-gpu:
    profiles: ["gpu-nvidia"]
    build:
      context: ./opencode
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: http://proxy.internal.adhie.ae:8080
        HTTPS_PROXY: http://proxy.internal.adhie.ae:8080
        NO_PROXY: localhost,127.0.0.1,.internal.adhie.ae
    container_name: opencode
    restart: unless-stopped
    volumes:
      - ./workspace:/workspace/architecture
      - ./comedian:/workspace/comedian
      - opencode_data:/root/.local/share/opencode
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - HTTP_PROXY=http://proxy.internal.adhie.ae:8080
      - HTTPS_PROXY=http://proxy.internal.adhie.ae:8080
      - NO_PROXY=localhost,127.0.0.1,.internal.adhie.ae
      - http_proxy=http://proxy.internal.adhie.ae:8080
      - https_proxy=http://proxy.internal.adhie.ae:8080
      - no_proxy=localhost,127.0.0.1,.internal.adhie.ae
    depends_on:
      - ollama-gpu
    stdin_open: true
    tty: true

  opencode-gpu-amd:
    profiles: ["gpu-amd"]
    build:
      context: ./opencode
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: http://proxy.internal.adhie.ae:8080
        HTTPS_PROXY: http://proxy.internal.adhie.ae:8080
        NO_PROXY: localhost,127.0.0.1,.internal.adhie.ae
    container_name: opencode
    restart: unless-stopped
    volumes:
      - ./workspace:/workspace/architecture
      - ./comedian:/workspace/comedian
      - opencode_data:/root/.local/share/opencode
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama-gpu-amd
    stdin_open: true
    tty: true

  ollama-gpu:
    profiles: ["gpu-nvidia"]
    <<: *service-ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama-gpu-amd:
    profiles: ["gpu-amd"]
    <<: *service-ollama
    image: ollama/ollama:rocm
    devices:
      - "/dev/kfd"
      - "/dev/dri"

  ollama-pull-llama-gpu:
    profiles: ["gpu-nvidia"]
    <<: *init-ollama
    depends_on:
      - ollama-gpu

  ollama-pull-llama-gpu-amd:
    profiles: ["gpu-amd"]
    <<: *init-ollama
    image: ollama/ollama:rocm
    depends_on:
      - ollama-gpu-amd
