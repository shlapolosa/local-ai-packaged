apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: code-review-agent
  title: Deploy Code Review Agent
  description: Deploy an AI-powered code review agent as an n8n workflow. The agent monitors a repository and provides automated code review feedback.
  tags:
    - ai-agent
    - code-review
    - n8n
    - deploy
spec:
  owner: guests
  type: agent

  parameters:
    - title: Repository Configuration
      required:
        - repoUrl
        - repoPAT
      properties:
        repoUrl:
          title: Repository URL
          type: string
          description: 'The full URL of the repository to monitor (e.g., https://dev.azure.com/org/project/_git/repo or https://github.com/org/repo).'
        repoPAT:
          title: Personal Access Token
          type: string
          description: A PAT with read access to the repository and write access to pull request comments.
          ui:widget: password
    - title: Agent Configuration
      required:
        - agentName
      properties:
        agentName:
          title: Agent Name
          type: string
          description: A unique name for this agent workflow instance.
          default: code-review-agent
        model:
          title: LLM Model
          type: string
          description: The Ollama model to use for code review.
          default: qwen2.5:7b-instruct-q4_K_M
          enum:
            - qwen2.5:7b-instruct-q4_K_M
            - llama3.1:8b-instruct-q4_K_M
          enumNames:
            - 'Qwen 2.5 7B (Recommended)'
            - 'LLaMA 3.1 8B'

  steps:
    - id: deploy-agent
      name: Deploy Code Review Agent to n8n
      action: http:backstage:request
      input:
        method: POST
        url: '${N8N_BASE_URL}/webhook/marketplace/deploy-agent'
        headers:
          Content-Type: application/json
        body:
          agentType: code-review
          agentName: ${{ parameters.agentName }}
          repoUrl: ${{ parameters.repoUrl }}
          repoPAT: ${{ parameters.repoPAT }}
          model: ${{ parameters.model }}

  output:
    text:
      - title: Agent Deployed
        content: |
          Your **Code Review Agent** has been deployed to n8n.

          - **Workflow Name**: ${{ parameters.agentName }}
          - **Repository**: ${{ parameters.repoUrl }}
          - **Model**: ${{ parameters.model }}

          The agent is now active and will review new pull requests automatically.
    links:
      - title: Open n8n
        url: http://localhost:5678
