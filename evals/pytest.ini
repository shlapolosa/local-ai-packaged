[pytest]
markers =
    fast: contract + retrieval tests, no LLM, < 60s total
    slow: monolith pipeline runs, multi-minute wall time
    regression: nightly regression set (includes slow)
    deploys: tests that trigger real app.submit / app.submit_wait — fire ArgoCD
    network: requires n8n + APIM reachable
    judge: uses LLM-as-judge (costs an extra gpt-5.4 call per slug)
    pipe: Open WebUI pipe rendering — no network, pure unit test
addopts = -ra --strict-markers --tb=short -p no:cacheprovider
asyncio_mode = auto
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
