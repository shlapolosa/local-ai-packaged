openapi: 3.1.0
info:
  title: {Service Name} API
  version: 1.0.0
  description: API specification for {Project Name}

servers:
  - url: https://api.{domain}.com/v1
    description: Production

tags:
  - name: {resource}
    description: {Resource description}

paths:
  /{resources}:
    get:
      operationId: list{Resources}
      summary: List all {resources}
      tags: [{resource}]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/{Resource}List'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      operationId: create{Resource}
      summary: Create a new {resource}
      tags: [{resource}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/{Resource}Create'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/{Resource}'

  /{resources}/{id}:
    get:
      operationId: get{Resource}
      summary: Get {resource} by ID
      tags: [{resource}]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/{Resource}'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      operationId: update{Resource}
      summary: Update {resource}
      tags: [{resource}]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/{Resource}Update'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/{Resource}'

    delete:
      operationId: delete{Resource}
      summary: Delete {resource}
      tags: [{resource}]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Deleted

components:
  schemas:
    {Resource}:
      type: object
      required: [id, {required_field}]
      properties:
        id:
          type: string
          format: uuid
        {field1}:
          type: string
        {field2}:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    {Resource}Create:
      type: object
      required: [{required_field}]
      properties:
        {field1}:
          type: string
        {field2}:
          type: string

    {Resource}List:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/{Resource}'
        pagination:
          $ref: '#/components/schemas/Pagination'

    Pagination:
      type: object
      properties:
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object }

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
